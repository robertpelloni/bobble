[package]
name = "omnicore-engine"
version = "0.1.0"
edition = "2021"

[dependencies]
rusqlite = { version = "0.31", features = ["bundled-sqlcipher"] }
tokio = { version = "1.37", features = ["rt", "rt-multi-thread", "sync", "macros"] }
prost = "0.12"
thiserror = "1.0"
async-trait = "0.1.92"
anyhow = "1.0.104"
reqwest = { version = "0.13.5", features = ["json"] }
